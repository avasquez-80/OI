name: Actualizar Open Interest Diario

'on':
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          pip install pandas yfinance requests matplotlib

      - name: Ejecutar Script de Barrido Diario
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python gestor_hist.py barrido

      - name: Guardar y Sincronizar Cambios en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add contratos_seguidos_db.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática diaria y escaneo de oportunidades [skip ci]" && git push)